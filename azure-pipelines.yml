trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*
      - azure-pipelines.yml

variables:
  - group: Epicbook-aws-secrets
  - group: Epicbook-mysql-secrets
  - name: tfStateBucket
    value: 'epicbook-tfstate-27075'
  - name: tfStateRegion
    value: 'eu-north-1'
  - name: tfStateKey
    value: 'epicbook.terraform.tfstate'
  - name: tfStateLockTable
    value: 'epicbook-tfstate-lock'
  - name: awsDefaultRegion
    value: 'eu-north-1'
  - name: terraformVersion
    value: '1.16.2'
  - name: allowedAdminIp
    value: '102.88.167.166/32'

stages:

  # ==================================================
  # STAGE 1: VALIDATE
  # ==================================================
  - stage: Validate
    displayName: 'Stage 1: Validate'
    pool:
      vmImage: 'ubuntu-latest'

    jobs:
      - job: ValidateJob
        displayName: 'Validate Terraform Configuration'

        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - script: |
              set -euo pipefail
              rm -rf terraform.zip tf_install
              curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
              mkdir tf_install
              unzip -o terraform.zip -d tf_install
              sudo mv tf_install/terraform /usr/local/bin/terraform
              rm -rf tf_install terraform.zip
              terraform version
            displayName: 'Install Terraform $(terraformVersion)'

          - script: |
              set -euo pipefail
              cd terraform
              terraform init -input=false \
                -backend-config="bucket=$(tfStateBucket)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="region=$(tfStateRegion)" \
                -backend-config="dynamodb_table=$(tfStateLockTable)"
            displayName: 'Initialize Terraform Backend'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)

          - script: |
              set -euo pipefail
              cd terraform
              terraform fmt -check -recursive
            displayName: 'Check Terraform Formatting'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)

          - script: |
              set -euo pipefail
              cd terraform
              terraform validate
            displayName: 'Validate Terraform Configuration'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)

  # ==================================================
  # STAGE 2: PLAN
  # ==================================================
  - stage: Plan
    displayName: 'Stage 2: Plan'
    dependsOn: Validate
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'

    jobs:
      - job: PlanJob
        displayName: 'Create Terraform Plan'

        steps:
          - checkout: self
            displayName: 'Checkout repository'

          # Get the pipeline agent's public IP so it can SSH to the backend
          - script: |
              set -euo pipefail
              AGENT_IP=$(curl -s ifconfig.me)
              echo "Pipeline agent public IP: $AGENT_IP"
              echo "##vso[task.setvariable variable=agentPublicIp]$AGENT_IP"
            displayName: 'Get Pipeline Agent Public IP'

          # Each stage runs on a fresh agent with no shared filesystem
          # so Terraform must be reinstalled on every stage
          - script: |
              set -euo pipefail
              rm -rf terraform.zip tf_install
              curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
              mkdir tf_install
              unzip -o terraform.zip -d tf_install
              sudo mv tf_install/terraform /usr/local/bin/terraform
              rm -rf tf_install terraform.zip
              terraform version
            displayName: 'Install Terraform $(terraformVersion)'

          - script: |
              set -euo pipefail
              cd terraform
              terraform init -input=false \
                -backend-config="bucket=$(tfStateBucket)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="region=$(tfStateRegion)" \
                -backend-config="dynamodb_table=$(tfStateLockTable)"
            displayName: 'Initialize Terraform Backend'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)

          - script: |
              set -euo pipefail
              cd terraform
              terraform plan -input=false \
                -var="aws_region=$(awsDefaultRegion)" \
                -var="vpc_cidr=10.20.0.0/16" \
                -var="public_subnet_cidr=10.20.1.0/24" \
                -var="private_subnet_cidr=10.20.2.0/24" \
                -var="private_subnet_cidr_2=10.20.3.0/24" \
                -var="instance_type=t3.micro" \
                -var="ssh_public_key_path=epicbook-aws-key.pub" \
                -var="allowed_admin_ip=$(allowedAdminIp)" \
                -var="pipeline_agent_ip=$(agentPublicIp)/32" \
                -var="backend_app_port=8080" \
                -var="db_name=epicbook" \
                -out=tfplan
            displayName: 'Generate Terraform Plan'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)
              TF_VAR_db_admin_username: $(mysqlAdminUsername)
              TF_VAR_db_admin_password: $(mysqlAdminPassword)

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Terraform Plan Artifact'
            inputs:
              pathToPublish: 'terraform/tfplan'
              artifactName: 'tfplan'

  # ==================================================
  # STAGE 3: APPLY
  # ==================================================
  - stage: Apply
    displayName: 'Stage 3: Apply'
    dependsOn: Plan
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'

    jobs:
      - deployment: ApplyJob
        displayName: 'Apply Terraform Changes'
        # This environment has a manual approval check configured in
        # Azure DevOps UI — pipeline pauses here until approved
        environment: 'epicbook-infra-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: 'Checkout repository'

                - task: DownloadBuildArtifacts@0
                  displayName: 'Download Terraform Plan'
                  inputs:
                    artifactName: 'tfplan'
                    downloadPath: '$(System.DefaultWorkingDirectory)/terraform'

                # Each stage runs on a fresh agent — reinstall Terraform
                - script: |
                    set -euo pipefail
                    rm -rf terraform.zip tf_install
                    curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
                    mkdir tf_install
                    unzip -o terraform.zip -d tf_install
                    sudo mv tf_install/terraform /usr/local/bin/terraform
                    rm -rf tf_install terraform.zip
                    terraform version
                  displayName: 'Install Terraform $(terraformVersion)'

                - script: |
                    set -euo pipefail
                    cd terraform
                    terraform init -input=false \
                      -backend-config="bucket=$(tfStateBucket)" \
                      -backend-config="key=$(tfStateKey)" \
                      -backend-config="region=$(tfStateRegion)" \
                      -backend-config="dynamodb_table=$(tfStateLockTable)"
                  displayName: 'Initialize Terraform Backend'
                  env:
                    AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
                    AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
                    AWS_DEFAULT_REGION: $(awsDefaultRegion)

                - script: |
                    set -euo pipefail
                    cd terraform
                    terraform apply -input=false tfplan
                  displayName: 'Apply Terraform'
                  env:
                    AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
                    AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
                    AWS_DEFAULT_REGION: $(awsDefaultRegion)

                - script: |
                    echo "##[error]Terraform apply failed! Review the error above."
                  displayName: 'Apply Failed — Check Logs'
                  condition: failed()

  # ==================================================
  # STAGE 4: OUTPUTS
  # ==================================================
  - stage: Outputs
    displayName: 'Stage 4: Outputs'
    dependsOn: Apply
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'

    jobs:
      - job: OutputsJob
        displayName: 'Print Infrastructure Outputs'

        steps:
          - checkout: self
            displayName: 'Checkout repository'

          # Each stage runs on a fresh agent — reinstall Terraform
          - script: |
              set -euo pipefail
              rm -rf terraform.zip tf_install
              curl -fsSL https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip -o terraform.zip
              mkdir tf_install
              unzip -o terraform.zip -d tf_install
              sudo mv tf_install/terraform /usr/local/bin/terraform
              rm -rf tf_install terraform.zip
              terraform version
            displayName: 'Install Terraform $(terraformVersion)'

          - script: |
              set -euo pipefail
              cd terraform
              terraform init -input=false \
                -backend-config="bucket=$(tfStateBucket)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="region=$(tfStateRegion)" \
                -backend-config="dynamodb_table=$(tfStateLockTable)"
            displayName: 'Initialize Terraform Backend'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)

          - script: |
              set -euo pipefail
              cd terraform
              echo "======================================"
              echo "   EpicBook Infrastructure Outputs   "
              echo "======================================"
              echo ""
              echo "app_public_ip:"
              terraform output -raw app_public_ip
              echo ""
              echo "backend_ansible_host:"
              terraform output -raw backend_ansible_host
              echo ""
              echo "backend_private_ip:"
              terraform output -raw backend_private_ip
              echo ""
              echo "mysql_fqdn:"
              terraform output -raw mysql_fqdn
              echo ""
              echo "======================================"
            displayName: 'Print Infrastructure Outputs'
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsDefaultRegion)
